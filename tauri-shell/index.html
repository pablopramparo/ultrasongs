<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ultrasongs</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; height: 100vh; display: grid; place-items: center;
        font-family: system-ui, "Segoe UI", sans-serif;
        background: #fafafa; color: #3f3f46;
      }
      @media (prefers-color-scheme: dark) { body { background: #09090b; color: #d4d4d8; } }
      main { text-align: center; }
      .dot { width: 10px; height: 10px; margin: 0 auto 16px; border-radius: 50%; background: #2563eb; animation: pulse 1s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.25; transform: scale(0.8); } }
      p { margin: 0; font-size: 14px; }
      small { color: #71717a; }
    </style>
  </head>
  <body>
    <main>
      <img src="logo.png" alt="Ultrasongs" width="260" style="display:block;margin:0 auto 28px" />
      <div class="dot"></div>
      <p>Iniciando Ultrasongs…</p>
      <small>Un momento</small>
    </main>
  </body>
</html>
